<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registry Satdik — LMS PRESISI</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><div class="app"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar" id="topbar"></header><div class="content"><div class="hero"><div class="page-actions" style="justify-content:space-between"><div><h1>Registry LMS Satdik</h1><p>Seluruh workspace satuan pendidikan dalam satu core platform nasional.</p></div><a class="btn btn-light admin-only" href="lms-unit-create.html">+ Buat LMS Satdik</a></div></div><div class="toolbar"><input class="control" id="registrySearch" aria-label="Cari workspace Satdik" placeholder="Cari nama, kode, atau wilayah"><select class="control" id="statusFilter" aria-label="Filter status workspace"><option value="all">Semua status</option><option>Aktif</option><option>Draft</option><option>Review</option><option>Suspend</option><option>Arsip</option></select><select class="control" id="typeFilter" aria-label="Filter jenis Satdik"><option value="all">Semua jenis</option><option>Sekolah Polisi Negara</option><option>Akademi</option><option>Perguruan Tinggi</option><option>Pusat Pendidikan</option><option>Sekolah Staf dan Pimpinan</option></select></div><div class="registry-summary" id="registrySummary"></div><section class="workspace-grid" id="registryGrid"></section></div></main></div><script src="../assets/js/app.js"></script><script>
renderSidebar("Registry Satdik");renderHeader("Registry LMS Satdik","Pusat / Registry");if(getRole()!=="adminpusat")document.querySelectorAll(".admin-only").forEach(x=>x.hidden=true);
const badgeClass={Aktif:"green",Draft:"blue",Review:"orange",Suspend:"orange",Arsip:"red"};
function renderRegistry(){const query=document.querySelector("#registrySearch").value.toLowerCase(),status=document.querySelector("#statusFilter").value,type=document.querySelector("#typeFilter").value,all=getStoredWorkspaces().filter(x=>x.id!=="nasional"),filtered=all.filter(x=>(status==="all"||x.status===status)&&(type==="all"||x.type===type)&&`${x.name} ${x.code} ${x.region}`.toLowerCase().includes(query));document.querySelector("#registrySummary").innerHTML=`<span><b>${all.length}</b> total workspace</span><span><b>${all.filter(x=>x.status==="Aktif").length}</b> aktif</span><span><b>${all.filter(x=>x.status==="Draft").length}</b> draft</span><span><b>${all.filter(x=>x.status==="Suspend").length}</b> suspend</span>`;document.querySelector("#registryGrid").innerHTML=filtered.length?filtered.map(x=>`<article class="workspace-card registry-card"><div class="workspace-card-top"><span class="workspace-monogram" style="${x.branding?.color?`background:${x.branding.color}`:""}">${escapeHtml(x.code.slice(0,2))}</span><span class="badge ${badgeClass[x.status]||"blue"}">${escapeHtml(x.status)}</span></div><div><div class="workspace-type">${escapeHtml(x.type)}</div><h2>${escapeHtml(x.name)}</h2><p>${escapeHtml(x.code)} • ${escapeHtml(x.region)} • ${x.modules} modul</p><small class="muted">Induk: ${escapeHtml(x.parent||"Mandiri")}</small></div><div class="page-actions"><a class="btn btn-primary" href="institution-manage.html?id=${encodeURIComponent(x.id)}">Kelola</a><button class="btn btn-light" onclick="openWorkspace('${x.id}')">Buka</button></div></article>`).join(""):`<div class="empty-state"><b>Satdik tidak ditemukan</b><span>Ubah pencarian atau buat LMS Satdik baru.</span></div>`}function openWorkspace(id){setWorkspace(id);openRoleHome()}document.querySelectorAll("#registrySearch,#statusFilter,#typeFilter").forEach(x=>x.addEventListener(x.tagName==="INPUT"?"input":"change",renderRegistry));renderRegistry();
</script></body></html>
