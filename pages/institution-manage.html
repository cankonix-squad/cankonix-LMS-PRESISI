<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola LMS Satdik — LMS PRESISI</title><link rel="stylesheet" href="../assets/css/main.css"></head><body><div class="app"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar" id="topbar"></header><div class="content" id="pageContent"></div></main></div><script src="../assets/js/app.js"></script><script>
const id=new URLSearchParams(location.search).get("id"),item=getWorkspaceById(id);renderSidebar("Registry Satdik");renderHeader("Kelola LMS Satdik","Pusat / Registry / Detail");const badgeClass={Aktif:"green",Draft:"blue",Review:"orange",Suspend:"orange",Arsip:"red"},institutionManager=getRole()==="adminpusat";
function requireInstitutionManager(){if(institutionManager)return true;alert("Akses pengelolaan workspace hanya tersedia untuk Admin Pusat.");return false}
function statusAction(status){if(!requireInstitutionManager())return;if(!item||defaultWorkspaces.some(x=>x.id===id)){alert("Pada prototype, status workspace master tidak dapat diubah.");return}if(!canTransitionWorkspaceStatus(item.status,status)){alert(`Transisi ${item.status} ke ${status} tidak diizinkan.`);return}if(confirm(`Ubah status ${item.name} menjadi ${status}?`)){updateCustomWorkspace(id,{status});item.status=status;renderPage()}}
function toggleOnboarding(index){if(!requireInstitutionManager()||!item||!item.onboarding)return;item.onboarding[index]=!item.onboarding[index];updateCustomWorkspace(id,{onboarding:item.onboarding});renderPage()}
function renderPage(){const root=document.querySelector("#pageContent");if(!item){root.innerHTML=`<div class="card empty-state"><b>Workspace tidak ditemukan</b><a class="btn btn-primary" href="institutions.html">Kembali ke Registry</a></div>`;return}const onboarding=item.onboarding||[true,true,true,true,true],tasks=["Lengkapi struktur organisasi dan jabatan","Validasi Pimpinan, Admin, dan hak akses","Import personel dan peserta","Buat program pendidikan pertama","Verifikasi dashboard dan laporan"],complete=onboarding.filter(Boolean).length;root.innerHTML=`<div class="hero institution-hero" style="--brand:${item.branding?.color||"#12335c"}"><div><div class="eyebrow">${escapeHtml(item.code)} • ${escapeHtml(item.type)}</div><h1>${escapeHtml(item.name)}</h1><p>${escapeHtml(item.region)} • Induk: ${escapeHtml(item.parent||"Mandiri")}</p></div><span class="badge ${badgeClass[item.status]||"blue"}">${escapeHtml(item.status)}</span></div><div class="tabs"><button class="tab active">Ringkasan</button><button class="tab">Konfigurasi</button><button class="tab">Modul</button><button class="tab">Akses</button><button class="tab">Data & Integrasi</button></div><div class="split-70"><div><section class="card"><div class="section-title">Konfigurasi Workspace</div><div class="review-list"><div class="review-item"><small>Domain</small><b>${escapeHtml(item.branding?.domain||"Belum ditentukan")}</b></div><div class="review-item"><small>Tahun Akademik</small><b>${escapeHtml(item.academicYear||"2027")}</b></div><div class="review-item"><small>Pimpinan Satdik</small><b>${escapeHtml(item.leader?.name||"Belum ditentukan")}</b></div><div class="review-item"><small>Admin Satdik</small><b>${escapeHtml(item.admin?.name||"Belum ditentukan")}</b></div><div class="review-item"><small>Sumber Data</small><b>${escapeHtml(item.source||"Input langsung")}</b></div><div class="review-item"><small>Sinkronisasi</small><b>${escapeHtml(item.sync||"Manual")}</b></div></div></section><section class="card" style="margin-top:18px"><div class="section-title">Capability Aktif (${item.modules})</div><div class="chip-list">${(item.moduleList||["Organisasi","Kurikulum","Learning","Assessment","Absensi","Aset"]).map(x=>`<span>${escapeHtml(x)}</span>`).join("")}</div></section></div><aside><section class="card"><div class="section-title">Onboarding Admin Satdik</div><div class="progress"><span style="width:${complete/tasks.length*100}%"></span></div><p class="muted">${complete} dari ${tasks.length} tugas selesai</p><div class="checklist">${tasks.map((task,index)=>`<label><input type="checkbox" ${onboarding[index]?"checked":""} onchange="toggleOnboarding(${index})">${task}</label>`).join("")}</div></section><section class="card danger-zone"><div class="section-title">Status Workspace</div><div class="page-actions"><button class="btn btn-light" onclick="statusAction('Draft')">Draft</button><button class="btn btn-primary" onclick="statusAction('Aktif')">Aktif</button><button class="btn btn-light" onclick="statusAction('Suspend')">Suspend</button><button class="btn btn-red" onclick="statusAction('Arsip')">Arsip</button></div></section></aside></div>`}renderPage();
</script><script>
const renderInstitutionPage=renderPage;
renderPage=function(){renderInstitutionPage();const root=document.querySelector("#pageContent"),actions=root?.querySelector(".danger-zone .page-actions");if(institutionManager&&item?.status==="Draft")actions?.insertAdjacentHTML("afterbegin",'<button class="btn btn-light" onclick="statusAction(\'Review\')">Ajukan Review</button>');if(!institutionManager){root?.insertAdjacentHTML("afterbegin",'<div class="alert">Mode baca-saja. Pengelolaan workspace hanya tersedia untuk Admin Pusat.</div>');root?.querySelectorAll("button,input")?.forEach(control=>{control.disabled=true})}};
renderPage();
</script></body></html>
