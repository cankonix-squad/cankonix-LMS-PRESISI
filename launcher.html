<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dynamic Launcher — LMS PRESISI LEMDIKLAT POLRI</title><link rel="stylesheet" href="assets/css/main.css"></head>
<body class="launcher-body"><header class="launcher-header"><a class="launcher-brand" href="launcher.html"><span class="launcher-logo">LP</span><span><b>LMS PRESISI</b><small>LEMDIKLAT POLRI</small></span></a><div class="launcher-user"><span id="launcherRole"></span><button type="button" class="launcher-reset" id="resetDemoButton">Reset Data Demo</button><a href="login.html" id="logoutLink">Keluar</a></div></header>
