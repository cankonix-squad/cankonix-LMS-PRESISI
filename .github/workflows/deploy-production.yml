name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust deployment host
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::GitHub secret VPS_HOST is empty or unavailable."
            exit 1
          fi

          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            : > ~/.ssh/known_hosts.scan
            for attempt in $(seq 1 5); do
              if ssh-keyscan -T 20 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts.scan 2>/dev/null &&
                [ -s ~/.ssh/known_hosts.scan ]; then
                break
              fi
              echo "Waiting for SSH host key from $DEPLOY_HOST (attempt $attempt/5)"
              sleep 5
            done

            if [ ! -s ~/.ssh/known_hosts.scan ]; then
              echo "::error::Could not read SSH host key from $DEPLOY_HOST. Check VPS_HOST, port 22 reachability from GitHub Actions, or set VPS_KNOWN_HOSTS."
              exit 1
            fi

            cat ~/.ssh/known_hosts.scan >> ~/.ssh/known_hosts
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and verify
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::GitHub secret VPS_HOST is empty or unavailable."
            exit 1
          fi
          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::GitHub secret VPS_USER is empty or unavailable."
            exit 1
          fi
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          APP_DIR=/root/cankonix-node/apps/cankonix-lms-lemdiklat
          cd "$APP_DIR"

          git config --global --add safe.directory "$APP_DIR"
          PREVIOUS_SHA=$(git rev-parse HEAD)
          git fetch origin main
          TARGET_SHA=$(git rev-parse origin/main)

          if [ "$PREVIOUS_SHA" = "$TARGET_SHA" ]; then
            echo "Production is already at $TARGET_SHA"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$PREVIOUS_SHA" "$TARGET_SHA")
          SERVICES=()
          INFRA_CHANGED=false
          THEME_CHANGED=false

          add_service() {
            local service="$1"
            case " ${SERVICES[*]} " in
              *" $service "*) ;;
              *) SERVICES+=("$service") ;;
            esac
          }

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^themes/keycloak/'; then
            INFRA_CHANGED=true
            THEME_CHANGED=true
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^docker-compose\.production\.yml$'; then
            INFRA_CHANGED=true
            add_service admin
            add_service educator
            add_service student
            add_service executive
            add_service api
          elif printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|packages/ui/|packages/api-client/|packages/types/|packages/tsconfig/|packages/eslint-config/)'; then
            add_service admin
            add_service educator
            add_service student
            add_service executive
            add_service api
          else
            printf '%s\n' "$CHANGED_FILES" | grep -q '^apps/admin/' && add_service admin || true
            printf '%s\n' "$CHANGED_FILES" | grep -q '^apps/educator/' && add_service educator || true
            printf '%s\n' "$CHANGED_FILES" | grep -q '^apps/student/' && add_service student || true
            printf '%s\n' "$CHANGED_FILES" | grep -q '^apps/executive/' && add_service executive || true
            printf '%s\n' "$CHANGED_FILES" | grep -q '^apps/api/' && add_service api || true
          fi

          if [ "${#SERVICES[@]}" -eq 0 ] && [ "$INFRA_CHANGED" = false ]; then
            echo "No deployable application service changed. Updating revision and verifying shared services."
            git reset --hard "$TARGET_SHA"
          else
            git reset --hard "$TARGET_SHA"
          fi

          rollback() {
            local exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              echo "Deployment failed; restoring previous application images"
              for service in "${SERVICES[@]}"; do
                image="cankonix-lms-lemdiklat-$service"
                rollback_image="$image:rollback-$PREVIOUS_SHA"
                if docker image inspect "$rollback_image" >/dev/null 2>&1; then
                  docker tag "$rollback_image" "$image:latest"
                fi
              done
              if [ "${#SERVICES[@]}" -gt 0 ]; then
                docker compose -f docker-compose.production.yml up -d --no-build "${SERVICES[@]}" || true
              fi
            fi
            exit "$exit_code"
          }
          trap rollback EXIT

          for service in "${SERVICES[@]}"; do
            image="cankonix-lms-lemdiklat-$service"
            if docker image inspect "$image:latest" >/dev/null 2>&1; then
              docker tag "$image:latest" "$image:rollback-$PREVIOUS_SHA"
            fi
          done

          if [ "$INFRA_CHANGED" = true ]; then
            docker compose -f docker-compose.production.yml up -d --no-build \
              postgres redis minio keycloak-db keycloak
            if [ "$THEME_CHANGED" = true ]; then
              docker compose -f docker-compose.production.yml up -d --no-build --force-recreate keycloak
            fi
          fi

          if [ "${#SERVICES[@]}" -gt 0 ]; then
            docker compose --parallel 1 -f docker-compose.production.yml build "${SERVICES[@]}"
            docker compose -f docker-compose.production.yml up -d --no-build "${SERVICES[@]}"
          fi

          wait_for_healthy() {
            local container="$1"
            local attempt
            for attempt in $(seq 1 36); do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$container" 2>/dev/null || true)
              if [ "$status" = healthy ]; then
                return 0
              fi
              if [ "$status" = unhealthy ]; then
                echo "$container reported unhealthy"
                docker logs --tail 80 "$container" || true
                return 1
              fi
              sleep 5
            done
            echo "Timed out waiting for $container to become healthy"
            docker logs --tail 80 "$container" || true
            return 1
          }

          if [ "$INFRA_CHANGED" = true ]; then
            for container in \
              cankonix-lms-lemdiklat-postgres-1 \
              cankonix-lms-lemdiklat-redis-1 \
              cankonix-lms-lemdiklat-minio-1 \
              cankonix-lms-lemdiklat-keycloak-db-1 \
              cankonix-lms-lemdiklat-keycloak-1; do
              wait_for_healthy "$container"
            done
          fi

          wait_for_healthy cankonix-lms-lemdiklat-keycloak-1
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.production.yml exec -T keycloak sh -c \
              '/opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080 --realm master --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD"' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Keycloak admin CLI did not become ready in time" >&2
              exit 1
            fi
            sleep 5
          done
          docker compose -f docker-compose.production.yml exec -T keycloak \
            /opt/keycloak/bin/kcadm.sh update realms/lemdiklat \
            -s loginTheme=lms-presisi
          docker compose -f docker-compose.production.yml exec -T keycloak \
            /opt/keycloak/bin/kcadm.sh get realms/lemdiklat \
            --fields loginTheme
          ADMIN_CLIENT_ID=$(docker compose -f docker-compose.production.yml exec -T keycloak \
            /opt/keycloak/bin/kcadm.sh get clients -r lemdiklat \
            -q clientId=lms-admin --fields id --format csv | tail -n 1 | tr -d '\r"')
          if [ -z "$ADMIN_CLIENT_ID" ]; then
            echo "Keycloak client lms-admin was not found" >&2
            exit 1
          fi
          docker compose -f docker-compose.production.yml exec -T keycloak \
            /opt/keycloak/bin/kcadm.sh update "clients/$ADMIN_CLIENT_ID" -r lemdiklat \
            -s 'redirectUris=["https://lms-presisi.digitallearningcenter.id/api/auth/callback","https://admin.lms-presisi.digitallearningcenter.id/api/auth/callback","http://localhost:3000/api/auth/callback"]' \
            -s 'webOrigins=["https://lms-presisi.digitallearningcenter.id","https://admin.lms-presisi.digitallearningcenter.id","http://localhost:3000"]'
          docker compose -f docker-compose.production.yml exec -T keycloak \
            /opt/keycloak/bin/kcadm.sh get "clients/$ADMIN_CLIENT_ID" -r lemdiklat \
            --fields clientId,redirectUris,webOrigins

          for service in "${SERVICES[@]}"; do
            case "$service" in
              admin) container=cankonix-lms-lemdiklat ;;
              educator) container=cankonix-lms-lemdiklat-educator ;;
              student) container=cankonix-lms-lemdiklat-student ;;
              executive) container=cankonix-lms-lemdiklat-executive ;;
              api) container=cankonix-lms-lemdiklat-api ;;
            esac
            wait_for_healthy "$container"
          done

          if printf '%s\n' "${SERVICES[@]}" | grep -qx api; then
            docker exec cankonix-lms-lemdiklat-api \
              /app/node_modules/.bin/prisma migrate deploy \
              --schema=/app/prisma/schema.prisma
          fi

          wait_for_url() {
            local url="$1"
            local attempt
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --retry 1 --retry-all-errors \
                --connect-timeout 10 --max-time 20 "$url" >/dev/null; then
                return 0
              fi
              echo "Waiting for public route: $url"
              sleep 5
            done
            echo "Public route did not become ready: $url"
            return 1
          }

          api_health=''
          for attempt in $(seq 1 12); do
            api_health=$(curl --silent --show-error --retry 1 --retry-all-errors \
              --connect-timeout 10 --max-time 20 \
              https://api.lms-presisi.digitallearningcenter.id/api/v1/health || true)
            if [ "$api_health" = '{"status":"ok"}' ]; then
              break
            fi
            echo "Waiting for public API readiness (attempt $attempt/12)"
            sleep 5
          done
          test "$api_health" = '{"status":"ok"}'
          wait_for_url https://lms-presisi.digitallearningcenter.id
          wait_for_url https://admin.lms-presisi.digitallearningcenter.id
          wait_for_url https://educator.lms-presisi.digitallearningcenter.id
          wait_for_url https://student.lms-presisi.digitallearningcenter.id
          wait_for_url https://executive.lms-presisi.digitallearningcenter.id
          trap - EXIT
          REMOTE_SCRIPT
