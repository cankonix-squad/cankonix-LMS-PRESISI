name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust deployment host
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::GitHub secret VPS_HOST is empty or unavailable."
            exit 1
          fi

          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            : > ~/.ssh/known_hosts.scan
            for attempt in $(seq 1 5); do
              if ssh-keyscan -T 20 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts.scan 2>/dev/null &&
                [ -s ~/.ssh/known_hosts.scan ]; then
                break
              fi
              echo "Waiting for SSH host key from $DEPLOY_HOST (attempt $attempt/5)"
              sleep 5
            done

            if [ ! -s ~/.ssh/known_hosts.scan ]; then
              echo "::error::Could not read SSH host key from $DEPLOY_HOST. Check VPS_HOST, port 22 reachability from GitHub Actions, or set VPS_KNOWN_HOSTS."
              exit 1
            fi

            cat ~/.ssh/known_hosts.scan >> ~/.ssh/known_hosts
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and verify
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::GitHub secret VPS_HOST is empty or unavailable."
            exit 1
          fi
          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::GitHub secret VPS_USER is empty or unavailable."
            exit 1
          fi
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          APP_DIR=/root/cankonix-node/apps/cankonix-lms-lemdiklat
          cd "$APP_DIR"

          git config --global --add safe.directory "$APP_DIR"
          PREVIOUS_SHA=$(git rev-parse HEAD)
          git fetch origin main
          TARGET_SHA=$(git rev-parse origin/main)

          # Prisma migrations live under apps/api and are shipped inside the API
          # image, so an api change is what the migration step keys off. Deploys
          # only reset the working tree when the revision actually changes.
          DEPLOY_REVISION_CHANGED=1
          if [ "$PREVIOUS_SHA" = "$TARGET_SHA" ]; then
            echo "Production is already at $TARGET_SHA"
            DEPLOY_REVISION_CHANGED=0
          fi

          CHANGED_FILES=$(git diff --name-only "$PREVIOUS_SHA" "$TARGET_SHA")
          SERVICES=()
          INFRA_CHANGED=false
          THEME_CHANGED=false
          MIGRATION_CHANGED=false

          add_service() {
            local service="$1"
            case " ${SERVICES[*]} " in
              *" $service "*) ;;
              *) SERVICES+=("$service") ;;
            esac
          }

          add_all_app_services() {
            add_service admin
            add_service educator
            add_service student
            add_service executive
            add_service api
          }

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^themes/keycloak/'; then
            INFRA_CHANGED=true
            THEME_CHANGED=true
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^docker-compose\.production\.yml$'; then
            INFRA_CHANGED=true
            add_all_app_services
          elif printf '%s\n' "$CHANGED_FILES" | grep -Eq '^\.github/workflows/deploy-production\.yml$'; then
            add_all_app_services
          elif printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|packages/ui/|packages/api-client/|packages/types/|packages/tsconfig/|packages/eslint-config/)'; then
            add_all_app_services
          else
            printf '%s\n' "$CHANGED_FILES" | grep -q '^apps/admin/' && add_service admin || true
            printf '%s\n' "$CHANGED_FILES" | grep -q '^apps/educator/' && add_service educator || true
            printf '%s\n' "$CHANGED_FILES" | grep -q '^apps/student/' && add_service student || true
            printf '%s\n' "$CHANGED_FILES" | grep -q '^apps/executive/' && add_service executive || true
            printf '%s\n' "$CHANGED_FILES" | grep -q '^apps/api/' && add_service api || true
          fi

          # A Prisma migration is applied by the API image, so a migration-only
          # change (e.g. a seed migration) must always force an API rebuild and
          # the migrate step. Without this, a commit that only adds
          # apps/api/prisma/migrations/... left the migration unapplied while the
          # workflow still reported success.
          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^apps/api/prisma/migrations/'; then
            MIGRATION_CHANGED=true
            add_service api
          fi

          if [ "$DEPLOY_REVISION_CHANGED" = "1" ]; then
            if [ "${#SERVICES[@]}" -eq 0 ] && [ "$INFRA_CHANGED" = false ]; then
              echo "No deployable application service changed. Updating revision and verifying shared services."
            fi
            git reset --hard "$TARGET_SHA"
          else
            echo "Working tree already at $TARGET_SHA; applying pending migrations only."
          fi

          rollback() {
            local exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              echo "Deployment failed; restoring previous application images"
              git reset --hard "$PREVIOUS_SHA" || true
              for service in "${SERVICES[@]}"; do
                image="cankonix-lms-lemdiklat-$service"
                rollback_image="$image:rollback-$PREVIOUS_SHA"
                if docker image inspect "$rollback_image" >/dev/null 2>&1; then
                  docker tag "$rollback_image" "$image:latest"
                fi
              done
              if [ "${#SERVICES[@]}" -gt 0 ]; then
                docker compose -f docker-compose.production.yml up -d --no-build "${SERVICES[@]}" || true
              fi
            fi
            exit "$exit_code"
          }
          trap rollback EXIT

          for service in "${SERVICES[@]}"; do
            image="cankonix-lms-lemdiklat-$service"
            if docker image inspect "$image:latest" >/dev/null 2>&1; then
              docker tag "$image:latest" "$image:rollback-$PREVIOUS_SHA"
            fi
          done

          if [ "$INFRA_CHANGED" = true ]; then
            docker compose -f docker-compose.production.yml up -d --no-build \
              postgres redis minio keycloak-db keycloak
            if [ "$THEME_CHANGED" = true ]; then
              docker compose -f docker-compose.production.yml up -d --no-build --force-recreate keycloak
            fi
          fi

          if [ "${#SERVICES[@]}" -gt 0 ]; then
            docker compose --parallel 1 -f docker-compose.production.yml build "${SERVICES[@]}"
            docker compose -f docker-compose.production.yml up -d --no-build "${SERVICES[@]}"
          fi

          wait_for_healthy() {
            local container="$1"
            local attempt
            for attempt in $(seq 1 36); do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$container" 2>/dev/null || true)
              if [ "$status" = healthy ]; then
                return 0
              fi
              if [ "$status" = unhealthy ]; then
                echo "$container reported unhealthy"
                docker logs --tail 80 "$container" || true
                return 1
              fi
              sleep 5
            done
            echo "Timed out waiting for $container to become healthy"
            docker logs --tail 80 "$container" || true
            return 1
          }

          if [ "$INFRA_CHANGED" = true ]; then
            for container in \
              cankonix-lms-lemdiklat-postgres-1 \
              cankonix-lms-lemdiklat-redis-1 \
              cankonix-lms-lemdiklat-minio-1 \
              cankonix-lms-lemdiklat-keycloak-db-1 \
              cankonix-lms-lemdiklat-keycloak-1; do
              wait_for_healthy "$container"
            done
          fi

          wait_for_healthy cankonix-lms-lemdiklat-keycloak-1
          if ! docker compose -f docker-compose.production.yml exec -T keycloak \
            test -f /opt/keycloak/themes/lms-presisi/login/theme.properties; then
            echo "Keycloak LMS PRESISI theme is not mounted; recreating Keycloak"
            docker compose -f docker-compose.production.yml up -d --no-build --force-recreate keycloak
            wait_for_healthy cankonix-lms-lemdiklat-keycloak-1
          fi
          if ! docker compose -f docker-compose.production.yml exec -T keycloak \
            test -f /opt/keycloak/themes/keycloak.v2/login/theme.properties; then
            echo "Keycloak v2 theme override is not mounted; recreating Keycloak"
            docker compose -f docker-compose.production.yml up -d --no-build --force-recreate keycloak
            wait_for_healthy cankonix-lms-lemdiklat-keycloak-1
          fi
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.production.yml exec -T keycloak sh -c \
              '/opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080 --realm master --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD"' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Keycloak admin CLI did not become ready in time" >&2
              exit 1
            fi
            sleep 5
          done
          docker compose -f docker-compose.production.yml exec -T keycloak \
            /opt/keycloak/bin/kcadm.sh update realms/lemdiklat \
            -s loginTheme=lms-presisi
          LOGIN_THEME=$(docker compose -f docker-compose.production.yml exec -T keycloak \
            /opt/keycloak/bin/kcadm.sh get realms/lemdiklat \
            --fields loginTheme --format csv | tail -n 1 | tr -d '\r"')
          if [ "$LOGIN_THEME" != "lms-presisi" ]; then
            echo "Expected Keycloak loginTheme=lms-presisi, got '$LOGIN_THEME'" >&2
            exit 1
          fi
          docker compose -f docker-compose.production.yml exec -T keycloak \
            /opt/keycloak/bin/kcadm.sh get realms/lemdiklat \
            --fields loginTheme
          ADMIN_CLIENT_ID=$(docker compose -f docker-compose.production.yml exec -T keycloak \
            /opt/keycloak/bin/kcadm.sh get clients -r lemdiklat \
            -q clientId=lms-admin --fields id --format csv | tail -n 1 | tr -d '\r"')
          if [ -z "$ADMIN_CLIENT_ID" ]; then
            echo "Keycloak client lms-admin was not found" >&2
            exit 1
          fi
          # Keycloak stores this attribute as a `##`-separated list
          # (Constants.CFG_DELIMITER), NOT as a JSON array. A JSON array is
          # parsed as a single malformed URI and the redirect is refused.
          ADMIN_POST_LOGOUT_URIS='https://lms-presisi.digitallearningcenter.id/##https://admin.lms-presisi.digitallearningcenter.id/##http://localhost:3000/'
          docker compose -f docker-compose.production.yml exec -T keycloak \
            /opt/keycloak/bin/kcadm.sh update "clients/$ADMIN_CLIENT_ID" -r lemdiklat \
            -s attributes.login_theme=lms-presisi \
            -s 'redirectUris=["https://lms-presisi.digitallearningcenter.id/api/auth/callback","https://admin.lms-presisi.digitallearningcenter.id/api/auth/callback","http://localhost:3000/api/auth/callback"]' \
            -s 'webOrigins=["https://lms-presisi.digitallearningcenter.id","https://admin.lms-presisi.digitallearningcenter.id","http://localhost:3000"]' \
            -s "attributes.post.logout.redirect.uris=$ADMIN_POST_LOGOUT_URIS"
          docker compose -f docker-compose.production.yml exec -T keycloak \
            /opt/keycloak/bin/kcadm.sh get "clients/$ADMIN_CLIENT_ID" -r lemdiklat \
            --fields clientId,attributes,redirectUris,webOrigins
          # A logout that cannot return to the LMS leaves the operator on
          # Keycloak's own page. Verify the allow-list is actually stored, so a
          # future silent drop fails the deploy instead of the operator. The
          # `attributes` payload is used on purpose: `redirectUris`/`webOrigins`
          # also contain this host, so grepping the whole client would be a
          # false pass.
          ADMIN_CLIENT_ATTRIBUTES=$(docker compose -f docker-compose.production.yml exec -T keycloak \
            /opt/keycloak/bin/kcadm.sh get "clients/$ADMIN_CLIENT_ID" -r lemdiklat \
            --fields attributes 2>/dev/null)
          if ! printf '%s' "$ADMIN_CLIENT_ATTRIBUTES" | grep -q 'lms-presisi\.digitallearningcenter\.id/'; then
            echo "Keycloak client lms-admin is missing a post-logout redirect URI in attributes: $ADMIN_CLIENT_ATTRIBUTES" >&2
            exit 1
          fi

          BOOTSTRAP_EXTERNAL_AUTH_ID=$(docker compose -f docker-compose.production.yml exec -T keycloak \
            /opt/keycloak/bin/kcadm.sh get users -r lemdiklat \
            -q username=bootstrap-admin --fields id --format csv | tail -n 1 | tr -d '\r"')
          if [ -z "$BOOTSTRAP_EXTERNAL_AUTH_ID" ] || [ "$BOOTSTRAP_EXTERNAL_AUTH_ID" = "id" ]; then
            echo "Keycloak user bootstrap-admin was not found; cannot grant bootstrap authorization" >&2
            exit 1
          fi

          for service in "${SERVICES[@]}"; do
            case "$service" in
              admin) container=cankonix-lms-lemdiklat ;;
              educator) container=cankonix-lms-lemdiklat-educator ;;
              student) container=cankonix-lms-lemdiklat-student ;;
              executive) container=cankonix-lms-lemdiklat-executive ;;
              api) container=cankonix-lms-lemdiklat-api ;;
            esac
            wait_for_healthy "$container"
          done

          # Migrations are applied by the one-shot `api-migrate` compose service,
          # which the `api` service depends on with
          # `service_completed_successfully`. Recreating it here makes the step
          # authoritative and observable: `docker wait` returns its exit code,
          # and a non-zero exit fails the deploy instead of letting the API
          # serve traffic from a stale schema.
          run_api_migrations() {
            echo "Applying Prisma migrations via the api-migrate one-shot service."
            docker compose -f docker-compose.production.yml \
              up -d --no-build --force-recreate api-migrate
            MIGRATE_EXIT=$(docker wait cankonix-lms-lemdiklat-api-migrate 2>/dev/null || echo 1)
            docker logs --tail 40 cankonix-lms-lemdiklat-api-migrate || true
            if [ "$MIGRATE_EXIT" != "0" ]; then
              echo "api-migrate exited $MIGRATE_EXIT: pending migrations were not applied" >&2
              exit 1
            fi
            # Independent verification against the database, so a green
            # one-shot cannot hide an unapplied migration.
            MIGRATE_STATUS=$(docker exec cankonix-lms-lemdiklat-api \
              /app/node_modules/.bin/prisma migrate status \
              --schema=/app/prisma/schema.prisma 2>&1 || true)
            printf '%s\n' "$MIGRATE_STATUS" | tail -n 6
            if printf '%s\n' "$MIGRATE_STATUS" | grep -q 'have not yet been applied'; then
              echo "Pending Prisma migrations remain after migrate deploy" >&2
              exit 1
            fi
            # TASK-009AI — idempotent: ensure bootstrap-admin holds the
            # authorization SUPER_ADMIN role so /roles and /assignments open.
            docker exec -e BOOTSTRAP_EXTERNAL_AUTH_ID="$BOOTSTRAP_EXTERNAL_AUTH_ID" \
              cankonix-lms-lemdiklat-api \
              node dist/scripts/bootstrap-admin-authorization.js
          }

          # Run migrations on every deploy. `migrate deploy` is idempotent and
          # the one-shot is recreated here, so this is always safe and removes
          # the detect-a-change gate that previously let a pending migration be
          # skipped.
          if docker image inspect cankonix-lms-lemdiklat-api:latest >/dev/null 2>&1; then
            run_api_migrations
          else
            echo "API image not present yet; the first deploy builds it before migrating."
          fi

          wait_for_url() {
            local url="$1"
            local attempt
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --retry 1 --retry-all-errors \
                --connect-timeout 10 --max-time 20 "$url" >/dev/null; then
                return 0
              fi
              echo "Waiting for public route: $url"
              sleep 5
            done
            echo "Public route did not become ready: $url"
            return 1
          }

          api_health=''
          for attempt in $(seq 1 12); do
            api_health=$(curl --silent --show-error --retry 1 --retry-all-errors \
              --connect-timeout 10 --max-time 20 \
              https://api.lms-presisi.digitallearningcenter.id/api/v1/health || true)
            if [ "$api_health" = '{"status":"ok"}' ]; then
              break
            fi
            echo "Waiting for public API readiness (attempt $attempt/12)"
            sleep 5
          done
          test "$api_health" = '{"status":"ok"}'
          wait_for_url https://lms-presisi.digitallearningcenter.id
          wait_for_url https://admin.lms-presisi.digitallearningcenter.id
          wait_for_url https://educator.lms-presisi.digitallearningcenter.id
          wait_for_url https://student.lms-presisi.digitallearningcenter.id
          wait_for_url https://executive.lms-presisi.digitallearningcenter.id
          trap - EXIT
          REMOTE_SCRIPT
